name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo actionlint.tar.gz "$URL"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  discord:
    name: Discord notify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: No webhook is a clean no-op
        id: noop
        uses: ./.github/actions/discord-notify
        with:
          webhook: ""
          status: start

      - name: Assert no-op
        env:
          MESSAGE_ID: ${{ steps.noop.outputs.message-id }}
        run: |
          test -z "$MESSAGE_ID"
          echo "ok: no-op returned an empty message id"
